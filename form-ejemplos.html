<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form extra</title>
  </head>
  <body>
    <form action="" method="get">
      <div>

        
        <label for="ciudades"> Ciudad:</label>

        <select name="ciudades" id="ciudades">
          <option value="ny">Nueva York</option>
          <option value="la">Los Angeles</option>
          <option value="chi">Chicago</option>
        </select>
      </div>
      <div>
     <h2> Lenguajes de programación </h2>
      <label for="Html"> Html:</label>
     <input type="radio" name="Lenguaje" id=" Html" value=" Html"/>
      <label for="CSS"> CSS:</label>
     <input type="radio" name="Lenguaje" id=" css" value=" css"/>
     <label for="Javascript"> Javascript:</label>
     <input type="radio" name="Lenguaje" id=" js" value=" js"/>



      </div>

      <div>
      <h2> Frameworks </h2>

       <label for="react"> 
       <input type="checkbox" name="Frameworks"  value="react"/>
        React
       </label>
       <label for="vue">
       <input type="checkbox" name="Frameworks" value="vue"/>
        Vue
       </label>
       <label for="angular">
       <input type="checkbox" name="Frameworks" value="angular"/>
       Angular
      </label>
    
      </div>

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
